  const renderSettings=()=>`<div class="section-toolbar"><div><div class="panel-title">Prototype settings</div><div class="panel-sub">Manage demonstration data and understand prototype behaviour</div></div></div><div class="settings-grid"><section class="panel setting-card"><h3>Demonstration data</h3><p>The prototype starts with sample projects, sample tasks and sample team members. Any changes you make are saved in this browser using local storage.</p><div style="font-size:10px;color:#64748b;margin-bottom:13px">Currently stored: <strong>${data.projects.length} projects</strong> · <strong>${data.tasks.length} tasks</strong> · <strong>${data.team.length} team members</strong></div><button class="danger-btn" id="reset-demo">↻ Reset demonstration data</button></section><section class="panel setting-card"><h3>Automation simulation</h3><p>PCAS calculates task deadlines when the workspace is opened or updated. Open tasks due today or within three days appear as reminders. Past-due open tasks are flagged as overdue.</p><span class="pill tone-amber">Simulated notifications</span></section><section class="panel setting-card"><h3>Data and privacy</h3><p>This standalone prototype does not send information to a server. The information you enter remains in this browser on this device. Avoid entering confidential organisational information.</p><span class="pill tone-green">Local browser storage</span></section><section class="panel setting-card"><h3>Production implementation direction</h3><p>A future organisational version could connect project records, tasks, calendars, documents and notifications to approved Microsoft 365 services, with organisation-managed access and retention policies.</p><span class="pill tone-blue">Future integration</span></section></div>`;
  const render=()=>{setHeader();const views={dashboard:renderDashboard,projects:renderProjects,tasks:renderTasks,calendar:renderCalendar,team:renderTeam,notifications:renderNotifications,reports:renderReports,settings:renderSettings};$('#page-content').innerHTML=(views[currentPage]||renderDashboard)();bindPageActions();};
  const openModal=(title,body,submitLabel,handler)=>{ $('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=`<button class="secondary-btn" id="modal-cancel">Cancel</button><button class="primary-btn" id="modal-submit">${submitLabel}</button>`;$('#modal-root').classList.add('open');$('#modal-root').setAttribute('aria-hidden','false');modalSubmit=handler;$('#modal-cancel').onclick=closeModal;$('#modal-submit').onclick=()=>{if(modalSubmit)modalSubmit();};};
  const closeModal=()=>{$('#modal-root').classList.remove('open');$('#modal-root').setAttribute('aria-hidden','true');modalSubmit=null;};
  const field=(label,name,value='',type='text',extra='')=>`<div class="form-field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${extra}></div>`;
  const selectField=(label,name,options,value)=>`<div class="form-field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>`;
  const val=name=>{const el=$(`#f-${name}`);return el?el.value.trim():'';};
  const openProjectForm=(id=null)=>{const p=id?projectById(id):null;const body=`<div class="form-grid">${field('Project name *','name',p?.name||'')}${field('Project code','code',p?.code||`PC-${String(data.projects.length+26).padStart(3,'0')}`)}<div class="form-field full"><label for="f-description">Description</label><textarea id="f-description" name="description">${escapeHtml(p?.description||'')}</textarea></div>${field('Project owner','owner',p?.owner||'Executive Assistant')}${selectField('Priority','priority',['High','Medium','Low'].map(x=>({value:x,label:x})),p?.priority||'Medium')}${field('Start date','start',p?.start||offsetDate(0),'date')}${field('Target completion date *','end',p?.end||offsetDate(14),'date')}${selectField('Project status','status',['Planning','Active','On Hold','Completed'].map(x=>({value:x,label:x})),p?.status||'Planning')}</div>`;
    openModal(p?'Edit project':'Register a project',body,p?'Save changes':'Create project',()=>{const name=val('name'),end=val('end');if(!name||!end){showToast('Please enter a project name and target date.');return;}const project={id:p?.id||makeId('p'),code:val('code')||`PC-${Date.now().toString().slice(-4)}`,name,description:$('#f-description').value.trim(),owner:val('owner')||'Executive Assistant',priority:val('priority'),start:val('start')||offsetDate(0),end,status:val('status')};if(p){Object.assign(p,project);addActivity(`Project updated: ${name}`);}else{data.projects.push(project);addActivity(`New project registered: ${name}`);}save();closeModal();render();showToast(p?'Project updated.':'Project created successfully.');});};
  const openTaskForm=(id=null,projectPreset='')=>{if(!data.projects.length){showToast('Create a project before adding tasks.');setPage('projects');return;}const t=id?data.tasks.find(x=>x.id===id):null;const projectOptions=[{value:'',label:'Select a project'},...data.projects.map(p=>({value:p.id,label:p.name}))];const memberOptions=[{value:'',label:'Unassigned'},...data.team.map(m=>({value:m.id,label:m.name}))];const pbody=`<div class="form-grid">${field('Task title *','title',t?.title||'')}<div class="form-field"><label for="f-projectId">Project *</label><select id="f-projectId">${projectOptions.map(o=>`<option value="${escapeHtml(o.value)}" ${(t?.projectId||projectPreset)===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div><div class="form-field full"><label for="f-description">Description / instructions</label><textarea id="f-description">${escapeHtml(t?.description||'')}</textarea></div><div class="form-field"><label for="f-assigneeId">Assigned to</label><select id="f-assigneeId">${memberOptions.map(o=>`<option value="${escapeHtml(o.value)}" ${t?.assigneeId===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>${field('Due date *','due',t?.due||offsetDate(7),'date')}${selectField('Priority','priority',['High','Medium','Low'].map(x=>({value:x,label:x})),t?.priority||'Medium')}${selectField('Status','status',['Planned','In Progress','Blocked','Completed'].map(x=>({value:x,label:x})),t?.status||'Planned')}</div>`;
    openModal(t?'Edit task':'Create a task',pbody,t?'Save changes':'Create task',()=>{const title=val('title'),projectId=val('projectId'),due=val('due');if(!title||!projectId||!due){showToast('Please complete the task title, project and due date.');return;}const task={id:t?.id||makeId('t'),title,projectId,assigneeId:val('assigneeId'),due,priority:val('priority'),status:val('status'),description:$('#f-description').value.trim()};if(t){Object.assign(t,task);addActivity(`Task updated: ${title}`);}else{data.tasks.push(task);addActivity(`Task created: ${title}`);}save();closeModal();render();showToast(t?'Task updated.':'Task assigned successfully.');});};
  const openMemberForm=id=>{const m=id?memberById(id):null;const body=`<div class="form-grid">${field('Full name *','name',m?.name||'')}${field('Job title / role','role',m?.role||'')}${field('Email address','email',m?.email||'','email')}${field('Department','department',m?.department||'')}</div>`;openModal(m?'Edit team member':'Add team member',body,m?'Save changes':'Add member',()=>{const name=val('name');if(!name){showToast('Please enter a team member name.');return;}const person={id:m?.id||makeId('m'),name,role:val('role')||'Team member',email:val('email'),department:val('department')};if(m){Object.assign(m,person);addActivity(`Team profile updated: ${name}`);}else{data.team.push(person);addActivity(`Team member added: ${name}`);}save();closeModal();render();showToast(m?'Team profile updated.':'Team member added.');});};
  const bindPageActions=()=>{
    $('#add-project')?.addEventListener('click',()=>openProjectForm());$('#add-task')?.addEventListener('click',()=>openTaskForm());$('#add-member')?.addEventListener('click',()=>openMemberForm());
    $('#project-search')?.addEventListener('input',e=>{projectQuery=e.target.value;const pos=e.target.selectionStart;render();const next=$('#project-search');next.focus();next.setSelectionRange(pos,pos);});
    $('#task-search')?.addEventListener('input',e=>{taskFilters.q=e.target.value;const pos=e.target.selectionStart;render();const next=$('#task-search');next.focus();next.setSelectionRange(pos,pos);});
    $('#filter-status')?.addEventListener('change',e=>{taskFilters.status=e.target.value;render();});$('#filter-priority')?.addEventListener('change',e=>{taskFilters.priority=e.target.value;render();});$('#filter-project')?.addEventListener('change',e=>{taskFilters.project=e.target.value;render();});
    $$('[data-edit-project]').forEach(b=>b.addEventListener('click',()=>openProjectForm(b.dataset.editProject)));
    $$('[data-project-tasks]').forEach(b=>b.addEventListener('click',()=>{taskFilters={...taskFilters,project:b.dataset.projectTasks};setPage('tasks');}));
    $$('[data-edit-task]').forEach(b=>b.addEventListener('click',()=>openTaskForm(b.dataset.editTask)));
    $$('[data-task-status]').forEach(s=>s.addEventListener('change',()=>{const t=data.tasks.find(x=>x.id===s.dataset.taskStatus);if(t){t.status=s.value;addActivity(`Task status changed: ${t.title} → ${t.status}`);save();render();showToast('Task status updated.');}}));
    $$('[data-edit-member]').forEach(b=>b.addEventListener('click',()=>openMemberForm(b.dataset.editMember)));
    $$('[data-notice-read]').forEach(b=>b.addEventListener('click',()=>{if(!data.readNotices.includes(b.dataset.noticeRead))data.readNotices.push(b.dataset.noticeRead);save();render();}));
    $('#mark-read')?.addEventListener('click',()=>{noticeItems().forEach(n=>{if(!data.readNotices.includes(n.id))data.readNotices.push(n.id);});save();render();showToast('All current reminders marked as read.');});
    $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.goto)));
    $('#export-csv')?.addEventListener('click',exportCsv);$('#print-report')?.addEventListener('click',()=>window.print());
    $('#reset-demo')?.addEventListener('click',()=>{if(confirm('Reset all PCAS prototype data to the original sample workspace? Your local changes will be lost.')){data=defaultData();save();taskFilters={q:'',status:'All statuses',priority:'All priorities',project:'All projects'};projectQuery='';addActivity('Demonstration data was reset');render();showToast('Sample workspace restored.');}});
  };
  const exportCsv=()=>{const rows=[['Task','Project','Assigned To','Due Date','Priority','Status','Description'],...data.tasks.map(t=>[t.title,projectName(t.projectId),ownerName(t.assigneeId),t.due,t.priority,t.status,t.description])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PCAS-task-report.csv';a.click();URL.revokeObjectURL(url);showToast('Task report exported.');};
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  $('#top-add-task').addEventListener('click',()=>openTaskForm());$('#top-notifications').addEventListener('click',()=>setPage('notifications'));
  $('#mobile-menu').addEventListener('click',()=>$('#sidebar').classList.toggle('mobile-open'));
  $('#modal-close').addEventListener('click',closeModal);$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-root')closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  $('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();taskFilters.q=q;projectQuery=q;setPage('tasks');}});
  save();render();
})();
</script>
</body>
</html>

<section id="auth"><form class="auth-card" id="login-form"><div class="brand"><div class="brand-mark">P</div><div>PCAS<div class="muted" style="font-size:12px;font-weight:400">Project Coordination Workspace</div></div></div><h1>Sign in</h1><p class="muted">Access your organisation's shared project workspace.</p><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="login-error" class="error"></div><button class="btn" id="login-btn">Sign in</button><p class="muted" style="font-size:12px;text-align:center">Secure session · Access depends on your assigned role</p></form></section>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const API='https://pcas-backend.onrender.com/api';
const TOKEN='pcas-session-token';
let token=localStorage.getItem(TOKEN)||'',user=null,projects=[],tasks=[],users=[],logs=[],page='dashboard',modalAction=null,loadWarnings=[];

let calendarOffset=0,selectedCalendarDate=localDateKey(new Date()),taskOverviewFilter='All',readNotifications=new Set(JSON.parse(localStorage.getItem('pcas-read-notifications')||'[]'));
function localDateKey(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function dateLabel(key,opts={day:'numeric',month:'short'}){if(!key)return '—';const [y,m,d]=key.slice(0,10).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,opts)}
function daysFromToday(key){const [y,m,d]=key.slice(0,10).split('-').map(Number),n=new Date();n.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-n)/86400000)}
function projectProgress(p){if(p.status==='Completed')return 100;const related=tasks.filter(t=>String(t.projectId?._id||t.projectId)===String(p._id));return related.length?Math.round(related.filter(t=>t.status==='Completed').length/related.length*100):0}
function dashboardNotifications(){const items=[];tasks.forEach(t=>{const d=daysFromToday(t.due);if(t.status!=='Completed'&&d<0)items.push({id:'late-'+t._id,kind:'danger',icon:'!',title:'Task overdue: '+t.title,detail:(t.projectId?.name||projectName(t.projectId))+' · '+Math.abs(d)+' day(s) overdue',date:t.due});else if(t.status!=='Completed'&&d>=0&&d<=2)items.push({id:'due-'+t._id,kind:'info',icon:'▣',title:'Upcoming task deadline: '+t.title,detail:(t.projectId?.name||projectName(t.projectId))+' · '+(d===0?'Due today':d+' day(s) left'),date:t.due})});logs.slice(0,8).forEach(l=>items.push({id:'log-'+l._id,kind:'success',icon:'✓',title:l.summary||l.action,detail:(l.actorId?.name||'PCAS user')+' · '+l.action,date:localDateKey(l.createdAt)}));return items.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).reverse().slice(0,8)}
function calendarPanel(){const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+calendarOffset);const y=base.getFullYear(),m=base.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=localDateKey(new Date()),monthName=base.toLocaleDateString(undefined,{month:'long',year:'numeric'});const taskDates=new Set(tasks.map(t=>t.due));let cells='';for(let i=0;i<first;i++)cells+='<span class="cal-blank"></span>';for(let d=1;d<=days;d++){const key=localDateKey(new Date(y,m,d));cells+='<button class="cal-day '+(key===today?'today ':'')+(key===selectedCalendarDate?'selected ':'')+(taskDates.has(key)?'has-event':'')+'" data-calendar-day="'+key+'">'+d+'</button>'}const dayTasks=tasks.filter(t=>t.due===selectedCalendarDate).sort((a,b)=>(a.due||'').localeCompare(b.due||''));const dayProjects=projects.filter(p=>p.end===selectedCalendarDate);return '<div class="card calendar-card"><div class="section-head" style="margin-top:0"><div><h3>My Calendar</h3><span class="muted">Deadlines and project dates from PCAS</span></div><div class="toolbar"><button class="btn secondary" data-calendar-prev>‹</button><button class="btn secondary" data-calendar-today>Today</button><button class="btn secondary" data-calendar-next>›</button></div></div><div class="calendar-month"><strong>'+monthName+'</strong><span class="muted">'+dateLabel(today,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</span></div><div class="calendar-grid calendar-weekdays">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="calendar-grid">'+cells+'</div><div class="calendar-events"><strong>'+dateLabel(selectedCalendarDate,{weekday:'long',day:'numeric',month:'long'})+'</strong>'+(dayTasks.length?dayTasks.map(t=>'<div class="event-row"><i></i><span><b>'+esc(t.title)+'</b><small>'+esc(t.projectId?.name||projectName(t.projectId))+' · '+esc(t.status)+'</small></span></div>').join(''):'')+(dayProjects.length?dayProjects.map(p=>'<div class="event-row project-event"><i></i><span><b>'+esc(p.name)+' milestone</b><small>Project target date</small></span></div>').join(''):'')+(!dayTasks.length&&!dayProjects.length?'<p class="muted">No PCAS deadlines on this date.</p>':'')+'</div></div>'}
function notificationsPanel(){const items=dashboardNotifications(),unread=items.filter(x=>!readNotifications.has(x.id)).length;return '<div class="card notification-card"><div class="section-head" style="margin-top:0"><h3>Notifications <span class="notification-count">'+unread+'</span></h3><button class="link-btn" data-notifications-read>Mark all as read</button></div><div class="notification-list">'+(items.length?items.map(n=>'<div class="notification-row '+(readNotifications.has(n.id)?'is-read':'')+'"><span class="notification-icon '+n.kind+'">'+n.icon+'</span><span class="notification-copy"><b>'+esc(n.title)+'</b><small>'+esc(n.detail)+'</small></span><time>'+dateLabel(n.date)+'</time></div>').join(''):'<div class="empty">No notifications right now.</div>')+'</div></div>'}
function activeProjectsPanel(){
 const rows=projects.filter(p=>p.status==='Active').sort((a,b)=>daysFromToday(a.end)-daysFromToday(b.end)).slice(0,6);
 const body=rows.map(p=>{const pct=projectProgress(p);return `<tr><td><b>${esc(p.name)}</b><small>${esc(p.code||'')}</small></td><td>${badge(daysFromToday(p.end)<0?'At Risk':'On Track')}</td><td><div class="progress-cell"><span class="progress-track"><i style="width:${pct}%"></i></span><b>${pct}%</b></div></td><td>${dateLabel(p.end)}</td><td>${badge(p.priority)}</td><td>${esc(p.owner||'—')}</td></tr>`;}).join('');
 return `<div class="card"><div class="section-head" style="margin-top:0"><div><h3>Active Projects</h3><span class="muted">${rows.length} active project(s)</span></div><button class="link-btn" data-page="projects">View all →</button></div>${rows.length?'<div class="table-wrap"><table class="dashboard-table"><thead><tr><th>Project</th><th>Status</th><th>Progress</th><th>Due date</th><th>Priority</th><th>Owner</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<div class="empty">No active projects. Projects marked Active will appear here.</div>'}</div>`;
}
function taskOverviewPanel(){
 const today=localDateKey(new Date()),weekEnd=new Date();weekEnd.setDate(weekEnd.getDate()+7);const weekKey=localDateKey(weekEnd);
 const filtered=tasks.filter(t=>taskOverviewFilter==='All'||(taskOverviewFilter==='Due This Week'&&t.status!=='Completed'&&t.due>=today&&t.due<=weekKey)||(taskOverviewFilter==='Overdue'&&t.status!=='Completed'&&t.due<today)||(taskOverviewFilter==='Completed'&&t.status==='Completed')).sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,8);
 const rows=filtered.map(t=>`<div class="overview-task"><span class="task-dot ${t.status==='Completed'?'done':t.status==='Blocked'?'blocked':''}"></span><span class="task-overview-name"><b>${esc(t.title)}</b><small>${esc(t.projectId?.name||projectName(t.projectId))} · ${esc(t.assigneeId?.name||assigneeName(t.assigneeId))}</small></span><time>${dateLabel(t.due)}</time></div>`).join('');
 const tabs=['All','Due This Week','Overdue','Completed'].map(x=>`<button class="${taskOverviewFilter===x?'active':''}" data-task-filter="${x}">${x}${x==='All'?' ('+tasks.length+')':x==='Overdue'?' ('+tasks.filter(t=>t.status!=='Completed'&&t.due<today).length+')':''}</button>`).join('');
 return `<div class="card"><div class="section-head" style="margin-top:0"><div><h3>Task Overview</h3><span class="muted">Track assignments and deadlines</span></div><button class="link-btn" data-page="tasks">All tasks →</button></div><div class="task-tabs">${tabs}</div>${filtered.length?'<div class="overview-task-list">'+rows+'</div>':'<div class="empty">No tasks in this category.</div>'}</div>`;
}
function progressPanel(){const total=tasks.length,done=tasks.filter(t=>t.status==='Completed').length,pct=total?Math.round(done/total*100):0,onTrack=projects.filter(p=>p.status==='Active'&&daysFromToday(p.end)>=0).length,atRisk=projects.filter(p=>p.status==='Active'&&daysFromToday(p.end)<0).length,onHold=projects.filter(p=>p.status==='On Hold').length;return '<div class="card progress-panel"><div class="section-head" style="margin-top:0"><h3>Project Progress</h3><span class="muted">Workspace overview</span></div><div class="progress-summary"><div class="donut" style="--progress:'+pct+'%"><div><b>'+pct+'%</b><small>Task completion</small></div></div><div class="progress-legend"><div><i class="legend-green"></i><span>Completed tasks</span><b>'+done+'</b></div><div><i class="legend-blue"></i><span>In progress / planned</span><b>'+(total-done)+'</b></div><div><i class="legend-amber"></i><span>Active projects at risk</span><b>'+atRisk+'</b></div><div><i class="legend-grey"></i><span>On hold projects</span><b>'+onHold+'</b></div></div></div><div class="progress-foot"><span>On track: <b>'+onTrack+'</b></span><span>At risk: <b>'+atRisk+'</b></span></div></div>'}
function milestonesPanel(){
 const today=localDateKey(new Date());const items=[...tasks.filter(t=>t.status!=='Completed'&&t.due>=today).map(t=>({name:t.title,date:t.due,type:'Task deadline'})),...projects.filter(p=>p.status!=='Completed'&&p.end>=today).map(p=>({name:p.name+' completion',date:p.end,type:'Project milestone'}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
 const rows=items.map((m,i)=>`<div class="milestone-row"><span class="milestone-flag">⚑</span><span><b>${esc(m.name)}</b><small>${m.type}</small></span><time>${dateLabel(m.date)}</time></div>`).join('');
 return `<div class="card"><div class="section-head" style="margin-top:0"><h3>Upcoming Milestones</h3><span class="muted">Next deadlines</span></div>${items.length?'<div class="milestone-list">'+rows+'</div>':'<div class="empty">No upcoming milestones have been scheduled.</div>'}</div>`;
}
async function api(path,opts={}){const res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const body=await res.json().catch(()=>({message:'Unexpected server response'}));if(!res.ok)throw Error(body.message||'Request failed');return body}

async function load(){loadWarnings=[];const results=await Promise.allSettled([api('/users'),api('/projects'),api('/tasks')]);const names=['team members','projects','tasks'];results.forEach((r,i)=>{if(r.status==='fulfilled'){if(i===0)users=r.value.users||[];if(i===1)projects=r.value.projects||[];if(i===2)tasks=r.value.tasks||[]}else{loadWarnings.push('Could not load '+names[i]+': '+r.reason.message)}});try{logs=(await api('/audit')).logs||[]}catch(e){logs=[];if(e.message!=='You do not have permission to perform this action.')loadWarnings.push('Audit activity is unavailable: '+e.message)}return loadWarnings}

function dashboard(){const s=stats(),upcoming=tasks.filter(t=>t.status!=='Completed'&&daysFromToday(t.due)>=0&&daysFromToday(t.due)<=7).length;return '<div class="welcome"><div><h1>Good day, '+esc(user.name)+'</h1><div class="muted">Here is your project overview. Projects in sync, people on track, progress every day.</div></div><button class="btn" data-action="project-new">＋ New project</button></div><div class="grid dashboard-stats">'+[['TOTAL TASKS',tasks.length,'▣','blue'],['COMPLETED',s.done,'✓','green'],['OVERDUE',tasks.filter(t=>t.status!=='Completed'&&daysFromToday(t.due)<0).length,'!','red'],['UPCOMING',upcoming,'◷','purple'],['ACTIVE PROJECTS',s.active,'♧','blue']].map(x=>'<div class="card stat-card"><span class="stat-icon '+x[3]+'">'+x[2]+'</span><div><div class="stat-label">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div></div>').join('')+'</div><div class="dashboard-top-grid">'+calendarPanel()+notificationsPanel()+'</div><div class="dashboard-bottom-grid"><div class="dashboard-main-col">'+activeProjectsPanel()+taskOverviewPanel()+'</div><div class="dashboard-side-col">'+progressPanel()+milestonesPanel()+'</div></div>'}function projectTable(rows){if(!rows.length)return '<div class="empty">No projects have been created yet.</div>';return '<div class="table-wrap"><table><thead><tr><th>Project</th><th>Owner</th><th>Target date</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.code||'')+'</div></td><td>'+esc(p.owner||'—')+'</td><td>'+esc(p.end||'—')+'</td><td>'+badge(p.status)+'</td><td><button class="btn secondary" data-edit-project="'+p._id+'">Edit</button></td></tr>').join('')+'</tbody></table></div>'}
function taskTable(rows){if(!rows.length)return '<div class="empty">No tasks to display.</div>';return '<div class="table-wrap"><table><thead><tr><th>Task</th><th>Project</th><th>Assigned to</th><th>Due</th><th>Status</th></tr></thead><tbody>'+rows.map(t=>'<tr><td><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.priority)+'</div></td><td>'+esc(t.projectId?.name||projectName(t.projectId))+'</td><td>'+esc(t.assigneeId?.name||assigneeName(t.assigneeId))+'</td><td>'+esc(t.due)+'</td><td><select data-task-status="'+t._id+'" style="padding:6px;border-radius:7px"><option '+(t.status==='Planned'?'selected':'')+'>Planned</option><option '+(t.status==='In Progress'?'selected':'')+'>In Progress</option><option '+(t.status==='Blocked'?'selected':'')+'>Blocked</option><option '+(t.status==='Completed'?'selected':'')+'>Completed</option></select></td></tr>').join('')+'</tbody></table></div>'}

const apps={msplanner:{name:'Microsoft Planner',icon:'▦',desc:'Open Microsoft Planner to manage shared plans, buckets, assignments and task progress.',url:'https://planner.cloud.microsoft'},teams:{name:'Microsoft Teams',icon:'◉',desc:'Open team conversations, channels and meetings for project collaboration.',url:'https://teams.microsoft.com'},onedrive:{name:'OneDrive',icon:'▤',desc:'Open Microsoft cloud file storage to share project documents and working files.',url:'https://onedrive.live.com'},outlook:{name:'Outlook',icon:'✉',desc:'Open email and calendar for correspondence, invitations and meeting coordination.',url:'https://outlook.office.com'},powerautomate:{name:'Power Automate',icon:'↗',desc:'Design approval flows, reminders and workflow automation for project processes.',url:'https://make.powerautomate.com'},powerbi:{name:'Power BI',icon:'▥',desc:'Open analytics workspaces and build management reports from connected data.',url:'https://app.powerbi.com'},copilot:{name:'Microsoft Copilot',icon:'✦',desc:'Open Copilot for assistance with drafting, summarising and planning.',url:'https://copilot.microsoft.com'}};

$('#logout').onclick=showLogin;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#quick-task').onclick=()=>{try{if(!canManage())return toast('Your role cannot create tasks.');taskForm()}catch(e){toast(e.message)}};
document.addEventListener('click',e=>{const prev=e.target.closest('[data-calendar-prev]');if(prev){calendarOffset--;render();return}const next=e.target.closest('[data-calendar-next]');if(next){calendarOffset++;render();return}const today=e.target.closest('[data-calendar-today]');if(today){calendarOffset=0;selectedCalendarDate=localDateKey(new Date());render();return}const day=e.target.closest('[data-calendar-day]');if(day){selectedCalendarDate=day.dataset.calendarDay;render();return}const filter=e.target.closest('[data-task-filter]');if(filter){taskOverviewFilter=filter.dataset.taskFilter;render();return}const mark=e.target.closest('[data-notifications-read]');if(mark){dashboardNotifications().forEach(n=>readNotifications.add(n.id));localStorage.setItem('pcas-read-notifications',JSON.stringify([...readNotifications]));render();return}});
document.addEventListener('change',async e=>{const status=e.target.closest('[data-task-status]');if(!status)return;try{await api('/tasks/'+status.dataset.taskStatus,{method:'PUT',body:JSON.stringify({status:status.value})});await refresh();render()}catch(err){toast(err.message);render()}});
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;$('#sidebar').classList.remove('open');render();return}const edit=e.target.closest('[data-edit-project]');if(edit){if(!canManage())return toast('You do not have permission to edit projects.');projectForm(edit.dataset.editProject);return}const a=e.target.closest('[data-action]');if(!a)return;try{switch(a.dataset.action){case'project-new':if(!canManage())throw Error('Your role cannot create projects.');projectForm();break;case'task-new':if(!canManage())throw Error('Your role cannot create tasks.');taskForm();break;case'user-new':if(user.role!=='EA_ADMIN')throw Error('Only an administrator can add accounts.');userForm();break;case'integration-info':toast(a.dataset.name+' requires Microsoft Entra application registration, admin consent and Graph API configuration before PCAS can exchange data.');break;case'copilot-ask':{const prompt=$('#copilot-prompt').value.toLowerCase(),blocked=tasks.filter(t=>t.status==='Blocked'),late=tasks.filter(t=>t.status!=='Completed'&&t.due&&t.due<new Date().toISOString().slice(0,10)),done=tasks.filter(t=>t.status==='Completed');let answer='PCAS workspace summary\\nProjects: '+projects.length+' total, '+projects.filter(p=>p.status==='Active').length+' active.\\nTasks: '+tasks.length+' total, '+done.length+' completed, '+blocked.length+' blocked and '+late.length+' overdue.\\n';if(blocked.length)answer+='\\nBlocked tasks:\\n'+blocked.map(t=>'• '+t.title+' — '+(t.projectId?.name||projectName(t.projectId))).join('\\n');if(late.length)answer+='\\n\\nOverdue tasks:\\n'+late.map(t=>'• '+t.title+' — due '+t.due).join('\\n');if(prompt.includes('recommend')||prompt.includes('attention'))answer+='\\n\\nSuggested next step: review overdue items with their owners, resolve blockers and confirm the next milestone dates.';$('#copilot-answer').textContent=answer;$('#copilot-answer').classList.remove('hidden');break;}}}catch(err){toast(err.message)}});
$('#modal-x').onclick=closeModal;$('#modal-cancel').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$('#modal-save').onclick=async()=>{const b=$('#modal-save');b.disabled=true;try{await modalAction()}catch(e){toast(e.message)}finally{b.disabled=false}};
async function start(){if(!token)return showLogin();try{const r=await api('/auth/me');user=r.user;await load();enter()}catch{showLogin()}}
start();
})();
</script></body></html>
